[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tfv"
version = "0.1.0"
description = "Live transcription and translation of the audio your computer is playing (zh-TW / en / ja)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "soxr>=0.3",
    "onnxruntime>=1.17",
    "faster-whisper>=1.1",
    "ctranslate2>=4.5",
    "tokenizers>=0.15",
    "sherpa-onnx>=1.10.20",
    "opencc>=1.1.9",
    "httpx>=0.27",
    "psutil>=5.9",
    "pyyaml>=6",
    "keyring>=24",
    "anthropic>=1.9",
    "PySide6-Essentials>=6.6",
    "PyAudioWPatch>=0.2.12; sys_platform == 'win32'",
]

[project.optional-dependencies]
# GPU speech recognition on NVIDIA cards. ctranslate2 bundles the cuDNN 9.10.2
# dispatcher DLL, and cuDNN refuses sub-libraries of a different version, so
# these two pins must move together.
nvidia = [
    "ctranslate2==4.8.2",
    "nvidia-cudnn-cu12==9.10.2.21",
    "nvidia-cublas-cu12>=12.4,<13",
]
dev = ["pytest>=8"]

[project.scripts]
tfv = "tfv.cli:main"

[project.gui-scripts]
tfv-app = "tfv.ui.app:main"

[tool.setuptools.packages.find]
include = ["tfv*"]

[tool.setuptools.package-data]
tfv = ["profiles.yaml", "assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
