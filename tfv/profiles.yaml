# Hardware profiles.
#
# The first profile whose `when` conditions all match this machine is used
# (see `python -m tfv hardware`). `asr` and `mt` are ladders, best first: the
# app takes the first rung that fits in memory, loads and runs fast enough,
# and steps down a rung while running if it cannot keep up with live audio.
# Optional asr_zh / asr_en / asr_ja replace `asr` for that spoken language, and
# mt_zh / mt_en / mt_ja replace `mt` for that target language.
#
# Rungs are "<model>@<device>" for local models (see `python -m tfv models`)
# or "<service>[:<model>]" for paid services.
#   devices: cuda = CTranslate2 on NVIDIA, gpu = llama.cpp on any GPU (Vulkan/Metal), cpu
#
# Conditions: os, arch, gpu_vendor, min_vram_mb, cuda (Whisper can use CUDA),
# min_ram_mb, min_cores. Profiles with `auto: false` are only used when chosen.
#
# Orderings follow EVAL.md (measured on an RTX 3050 4 GB laptop):
# - Whisper turbo recognizes best, but SenseVoice on the CPU is close for
#   Chinese and Japanese and leaves the GPU to a 4B translator, which
#   translates much better than 2B (ja→zh chrF 24 vs 14). For English speech,
#   especially with background sound, Whisper is clearly better.
# - SenseVoice beat Whisper small in every language, so it is the fallback.
# - TranslateGemma-4B translates best into Chinese, Qwen3.5-4B into English
#   and Japanese. Models larger than 4B were not measured (too big here).

profiles:
  - name: gpu-high
    summary: NVIDIA GPU with 16 GB+ VRAM
    when: {gpu_vendor: [nvidia], cuda: true, min_vram_mb: 15000}
    asr: [whisper-large-v3@cuda, whisper-large-v3-turbo@cuda, sensevoice-small@cpu]
    mt: [qwen3.5-9b@gpu, translategemma-12b@gpu, qwen3.5-4b@gpu, qwen3.5-2b@gpu, nllb-600m@cpu]
    mt_zh: [translategemma-12b@gpu, qwen3.5-9b@gpu, translategemma-4b@gpu, qwen3.5-2b@gpu, nllb-600m@cpu]

  - name: gpu-mid
    summary: NVIDIA GPU with 8-12 GB VRAM
    when: {gpu_vendor: [nvidia], cuda: true, min_vram_mb: 7500}
    asr: [whisper-large-v3-turbo@cuda, sensevoice-small@cpu]
    mt: [qwen3.5-9b@gpu, qwen3.5-4b@gpu, translategemma-4b@gpu, qwen3.5-2b@gpu, nllb-600m@cpu]
    mt_zh: [translategemma-12b@gpu, qwen3.5-9b@gpu, translategemma-4b@gpu, qwen3.5-2b@gpu, nllb-600m@cpu]

  - name: gpu-small
    summary: NVIDIA GPU with 4-6 GB VRAM
    when: {gpu_vendor: [nvidia], cuda: true, min_vram_mb: 3500}
    asr: [whisper-large-v3-turbo@cuda, sensevoice-small@cpu]
    asr_zh: [sensevoice-small@cpu, whisper-large-v3-turbo@cuda]
    asr_ja: [sensevoice-small@cpu, whisper-large-v3-turbo@cuda]
    mt: [qwen3.5-4b@gpu, translategemma-4b@gpu, qwen3.5-2b@gpu, qwen3.5-2b@cpu, nllb-600m@cpu]
    mt_zh: [translategemma-4b@gpu, qwen3.5-4b@gpu, qwen3.5-2b@gpu, qwen3.5-2b@cpu, nllb-600m@cpu]

  - name: vulkan-gpu
    summary: AMD or Intel Arc GPU, or NVIDIA without CUDA libraries (speech on CPU, translation on the GPU)
    when: {gpu_vendor: [amd, intel, nvidia], min_vram_mb: 3500}
    asr: [sensevoice-small@cpu]
    mt: [qwen3.5-4b@gpu, translategemma-4b@gpu, qwen3.5-2b@gpu, nllb-600m@cpu]
    mt_zh: [translategemma-4b@gpu, qwen3.5-4b@gpu, qwen3.5-2b@gpu, nllb-600m@cpu]

  - name: apple
    summary: Apple Silicon Mac (translation on the GPU through Metal)
    when: {os: [macos], arch: [arm64]}
    asr: [sensevoice-small@cpu, whisper-small@cpu]
    mt: [qwen3.5-4b@gpu, translategemma-4b@gpu, qwen3.5-2b@gpu, nllb-600m@cpu]
    mt_zh: [translategemma-4b@gpu, qwen3.5-4b@gpu, qwen3.5-2b@gpu, nllb-600m@cpu]

  - name: cpu-high
    summary: no usable GPU, 6+ cores and 16 GB RAM
    when: {min_cores: 6, min_ram_mb: 15000}
    asr: [sensevoice-small@cpu]
    mt: [qwen3.5-2b@cpu, nllb-600m@cpu]

  - name: cpu-low
    summary: any other computer
    when: {}
    asr: [sensevoice-small@cpu]
    mt: [nllb-600m@cpu]

  - name: cloud
    summary: paid services for everything (needs API keys; never chosen automatically)
    auto: false
    asr: [openai:gpt-4o-mini-transcribe, deepgram:nova-3, sensevoice-small@cpu]
    mt: [deepl, claude, openai, nllb-600m@cpu]
